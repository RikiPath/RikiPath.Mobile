name: rikipath_mobile
description: RikiPath learner mobile app starter (Flutter)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  dio: ^5.11.1
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.4
  intl: any
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  image_picker: ^1.2.1
  file_picker: ^13.3.1
  flutter_svg: ^2.2.1
  video_player: ^2.14.0
  just_audio: ^0.10.6
  url_launcher: ^6.3.2
  azure_speech_services: ^1.0.7
  record: ^7.1.1
  stroke_order_animator: ^3.3.1
  flutter_webrtc: ^1.6.2+hotfix.4
  signalr_hub: ^2.2.1
  permission_handler: ^12.0.3
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.34.6
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/flags/vi.svg
    - assets/flags/ja.svg
    - assets/images/auth/auth_sakura_background.webp
    - assets/images/auth/sakura_hourglass.png
    - assets/images/auth/sakura_onboarding_complete.png
    - assets/images/mascot/
    - assets/images/icons_3d/
    - assets/images/icons_2d/
    - assets/images/time_banners/
    - assets/images/practice/
    - assets/images/notebook/
    - assets/images/learning/
