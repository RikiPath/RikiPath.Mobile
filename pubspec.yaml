name: rikipath_mobile
description: RikiPath learner mobile app starter (Flutter)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  dio: ^5.11.1
  flutter_secure_storage: ^11.0.0
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  connectivity_plus: ^7.3.1
  video_player: ^2.14.0
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.34.6

flutter:
  uses-material-design: true
