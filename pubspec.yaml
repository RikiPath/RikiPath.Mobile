name: rikipath_mobile
description: RikiPath learner mobile app starter (Flutter)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  dio: ^5.11.1
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.4
  intl: any
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  image_picker: ^1.2.1
  flutter_svg: ^2.2.1
  video_player: ^2.14.0
  just_audio: ^0.10.6
  url_launcher: ^6.3.2
  azure_speech_services: ^1.0.7
  record: ^7.1.1
  stroke_order_animator: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.34.6

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/flags/vi.svg
    - assets/flags/ja.svg
