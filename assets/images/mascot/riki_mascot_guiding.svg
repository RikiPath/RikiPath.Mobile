<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <!-- Guidance Warm Glow -->
  <circle cx="120" cy="120" r="100" fill="#FFF5F7" opacity="0.6"/>
  <circle cx="120" cy="120" r="85" fill="#FFE8ED" opacity="0.4"/>

  <!-- Fluffy Tail -->
  <path d="M165 170 C195 160 215 130 205 105 C198 88 175 92 165 110 C155 125 155 155 165 170 Z" fill="#FCFBFB" stroke="#2D282A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M190 120 C205 105 205 95 195 90 C185 85 175 92 170 102 C178 112 185 116 190 120 Z" fill="#E05A7A" opacity="0.85"/>

  <!-- Body -->
  <ellipse cx="120" cy="165" rx="46" ry="40" fill="#FCFBFB" stroke="#2D282A" stroke-width="3"/>
  <ellipse cx="120" cy="170" rx="30" ry="26" fill="#FFF0F3"/>

  <!-- Feet -->
  <ellipse cx="92" cy="195" rx="16" ry="10" fill="#FCFBFB" stroke="#2D282A" stroke-width="3"/>
  <ellipse cx="148" cy="195" rx="16" ry="10" fill="#FCFBFB" stroke="#2D282A" stroke-width="3"/>

  <!-- Left & Right Ears -->
  <path d="M80 92 L62 45 C60 40 68 36 74 40 L102 75 Z" fill="#FCFBFB" stroke="#2D282A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M78 82 L68 52 L94 72 Z" fill="#FFE8ED"/>
  <path d="M68 52 L62 45 L74 40 Z" fill="#E05A7A"/>

  <path d="M160 92 L178 45 C180 40 172 36 166 40 L138 75 Z" fill="#FCFBFB" stroke="#2D282A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M162 82 L172 52 L146 72 Z" fill="#FFE8ED"/>
  <path d="M172 52 L178 45 L166 40 Z" fill="#E05A7A"/>

  <!-- Head -->
  <ellipse cx="120" cy="105" rx="52" ry="46" fill="#FCFBFB" stroke="#2D282A" stroke-width="3"/>

  <!-- Forehead Sakura Crest -->
  <g transform="translate(120,78) scale(0.7)">
    <circle cx="0" cy="-10" r="6" fill="#E05A7A"/>
    <circle cx="9.5" cy="-3.1" r="6" fill="#E05A7A"/>
    <circle cx="5.9" cy="8.1" r="6" fill="#E05A7A"/>
    <circle cx="-5.9" cy="8.1" r="6" fill="#E05A7A"/>
    <circle cx="-9.5" cy="-3.1" r="6" fill="#E05A7A"/>
    <circle cx="0" cy="0" r="4" fill="#F59E0B"/>
  </g>

  <!-- Rosy Cheeks -->
  <ellipse cx="88" cy="116" rx="9" ry="5.5" fill="#F8BBD0" opacity="0.8"/>
  <ellipse cx="152" cy="116" rx="9" ry="5.5" fill="#F8BBD0" opacity="0.8"/>

  <!-- Attentive, Friendly Eyes -->
  <ellipse cx="98" cy="104" rx="5" ry="6" fill="#2D282A"/>
  <circle cx="100" cy="102" r="1.8" fill="#FFFFFF"/>
  <ellipse cx="142" cy="104" rx="5" ry="6" fill="#2D282A"/>
  <circle cx="144" cy="102" r="1.8" fill="#FFFFFF"/>

  <!-- Cute Nose & Smile -->
  <polygon points="120,113 117,110 123,110" fill="#2D282A"/>
  <path d="M117 117 C120 120 123 117 123 117" stroke="#2D282A" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Left Paw (resting) -->
  <ellipse cx="96" cy="158" rx="8" ry="12" fill="#FCFBFB" stroke="#2D282A" stroke-width="2.5"/>

  <!-- Right Paw Gesturing / Holding Educational Pointer -->
  <g transform="translate(148,142) rotate(20)">
    <!-- Slender bamboo pointer stick -->
    <line x1="0" y1="10" x2="35" y2="-20" stroke="#754B12" stroke-width="3" stroke-linecap="round"/>
    <polygon points="35,-20 32,-15 37,-16" fill="#F59E0B"/>
    <!-- Paw holding pointer -->
    <ellipse cx="10" cy="2" rx="9" ry="12" fill="#FCFBFB" stroke="#2D282A" stroke-width="2.5"/>
  </g>
</svg>
