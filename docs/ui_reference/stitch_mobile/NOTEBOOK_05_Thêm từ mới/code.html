    </button>

<script>
  (function() {
    const jlptButtons = document.querySelectorAll('#jlpt-group .jlpt-chip');
    jlptButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        jlptButtons.forEach(b => {
          b.className = 'jlpt-chip h-11 rounded-lg bg-surface-container-low text-on-surface font-label-md text-label-md flex items-center justify-center transition-all';
        });
        btn.className = 'jlpt-chip h-11 rounded-lg bg-primary text-on-primary font-label-md text-label-md flex items-center justify-center shadow-sm transition-all';
      });
    });

    const posButtons = document.querySelectorAll('#pos-group .pos-chip');
    posButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const isSelected = btn.classList.contains('bg-primary');
        if (isSelected) {
          btn.className = 'pos-chip px-3.5 h-10 rounded-lg bg-surface-container-low text-on-surface font-label-md text-label-md flex items-center justify-center transition-all';
        } else {
          btn.className = 'pos-chip px-3.5 h-10 rounded-lg bg-primary text-on-primary font-label-md text-label-md flex items-center justify-center shadow-sm transition-all';
        }
      });
    });

    const saveBtn = document.getElementById('save-btn');
    saveBtn.addEventListener('click', () => {
      const originalText = saveBtn.innerHTML;
      saveBtn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span> Đang lưu...';
      saveBtn.disabled = true;
      setTimeout(() => {
        saveBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check_circle</span> Đã lưu thành công!';
        saveBtn.className = 'w-full h-12 rounded-xl bg-secondary-container text-on-secondary-container font-title-sm text-title-sm flex items-center justify-center gap-2 shadow-md transition-all';
        setTimeout(() => {
          saveBtn.innerHTML = originalText;
          saveBtn.className = 'w-full h-12 rounded-xl bg-primary active:bg-secondary text-on-primary font-title-sm text-title-sm flex items-center justify-center gap-2 shadow-md hover:shadow-lg transition-all';
          saveBtn.disabled = false;
        }, 1500);
      }, 600);
    });
  })();
