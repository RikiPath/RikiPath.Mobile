<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Phòng thi - Nghe hiểu (Đang phát Audio)</title>
<!-- Tailwind CSS v3 with forms and container queries plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts for Japanese & Vietnamese typography -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Noto Sans JP"', 'sans-serif'],
            jp: ['"Noto Sans JP"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#fff1f2',
              100: '#ffe4e6',
              500: '#f43f5e',
              600: '#e11d48',
              700: '#be123c',
              800: '#9f1239',
              900: '#881337',
            }
          }
        }
      }
    }
  </script>
<style data-purpose="custom-animations">
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .animate-pulse-dot {
      animation: pulse-dot 1.4s ease-in-out infinite;
    }
    /* Waveform visual animation simulation */
    @keyframes bar-wave {
      0%, 100% { height: 28%; }
      50% { height: 95%; }
    }
    .playing-bar {
      animation: bar-wave 1.1s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between select-none">
<!-- BEGIN: MainContainer -->
<div class="w-full max-w-[430px] mx-auto min-h-screen flex flex-col bg-[#F8FAFC] pb-24 shadow-sm relative">
<!-- BEGIN: TopExamHeader -->
<!-- Fixed/Sticky top navigation bar with exam metadata and timer -->
<header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md px-4 py-3 border-b border-slate-100 flex items-center justify-between">
<!-- Exit Exam Button -->
<button aria-label="Đóng phòng thi" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-700 transition" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Exam Title -->
<div class="text-center">
<h1 class="text-sm font-bold text-slate-900 tracking-tight">JLPT N4 • Đề #01</h1>
</div>
<!-- Timer Pill (Exact 00:24:31) -->
<div class="flex items-center gap-1.5 px-3 py-1 bg-amber-50 border border-amber-200/80 rounded-full text-amber-900 text-xs font-semibold tabular-nums">
<svg class="w-3.5 h-3.5 text-amber-600 animate-spin" fill="none" stroke="currentColor" stroke-width="2.2" style="animation-duration: 9s;" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle cx="12" cy="12" fill="none" opacity="0.3" r="9" stroke="currentColor" stroke-width="2"></circle>
<path d="M12 7v5l3 3" stroke-linecap="round"></path>
</svg>
<span>00:24:31</span>
</div>
</header>
<!-- END: TopExamHeader -->
<!-- BEGIN: QuestionMetaSection -->
<!-- Section info, question tracker, and mark button -->
<section class="px-4 pt-3.5 pb-2">
<div class="flex items-center justify-between text-xs text-slate-500 mb-1">
<div class="flex items-center gap-2">
<span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-bold bg-slate-200 text-slate-700">N4</span>
<span class="font-bold text-slate-900 text-sm">Phần 3: Nghe hiểu</span>
</div>
<span class="inline-flex items-center gap-1 text-[11px] text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full font-medium">
<svg class="w-3.5 h-3.5" fill="currentColor" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" fill-rule="evenodd"></path>
</svg>
          Đã tự lưu
        </span>
</div>
<div class="flex items-end justify-between mt-2 mb-1.5">
<div class="flex items-baseline gap-1">
<span class="text-xl font-extrabold text-brand-700">Câu 07</span>
<span class="text-xs font-semibold text-slate-400">/ 30</span>
</div>
<!-- Bookmark button -->
<button class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-slate-600 bg-white border border-slate-200 hover:border-slate-300 rounded-full shadow-xs active:scale-95 transition" type="button">
<svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Đánh dấu câu này</span>
</button>
</div>
<!-- Linear Progress Bar -->
<div class="w-full h-1.5 bg-slate-200/80 rounded-full overflow-hidden mt-1">
<div class="h-full bg-brand-600 rounded-full" style="width: 23.3%;"></div>
</div>
</section>
<!-- END: QuestionMetaSection -->
<!-- BEGIN: MainQuestionArea -->
<main class="px-4 pt-2 flex-1 flex flex-col gap-3">
<!-- BEGIN: AudioPlayerCard -->
<!-- Card showing current playback state (Playing state) -->
<article class="bg-white rounded-2xl border border-red-100 p-3.5 shadow-sm" data-purpose="audio-player">
<!-- Top row: Audio category title & listened count badge -->
<div class="flex items-center justify-between pb-2 border-b border-slate-100">
<div class="flex items-center gap-2">
<div class="w-7 h-7 rounded-lg bg-red-50 flex items-center justify-center text-brand-600">
<svg class="w-4 h-4" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.5A2.25 2.25 0 002.25 9.75v4.5A2.25 2.25 0 004.5 16.5h1.94l4.5 4.5c.944.945 2.56.276 2.56-1.06V4.06zM18.584 5.106a.75.75 0 011.06 0c3.808 3.807 3.808 9.98 0 13.788a.75.75 0 01-1.06-1.06 8.25 8.25 0 000-11.668.75.75 0 010-1.06z"></path>
</svg>
</div>
<span class="text-xs font-bold text-slate-800">Mondai 1 • Nghe hiểu nội dung</span>
</div>
<span class="px-2 py-0.5 text-[11px] font-bold bg-amber-50 text-amber-700 border border-amber-200/80 rounded-md">
            Lượt nghe: 1 / 2
          </span>
</div>
<!-- Middle: Status & Time & Waveform -->
<div class="py-3">
<div class="flex items-center justify-between text-xs mb-2">
<!-- Pulsing active status -->
<div class="inline-flex items-center gap-1.5 font-bold text-red-600">
<span class="w-2.5 h-2.5 rounded-full bg-red-600 animate-pulse-dot inline-block"></span>
<span>Đang phát</span>
</div>
<!-- Playback counter: 00:18 / 00:42 (~42% progress) -->
<div class="text-xs font-bold font-mono text-slate-600">
<span class="text-brand-600">00:18</span> / <span>00:42</span>
</div>
</div>
<!-- Dynamic Audio Waveform (42% played in red brand, remaining in slate-200) -->
<div class="w-full h-10 bg-slate-50 rounded-xl px-3 py-1 flex items-center justify-between gap-[3px] overflow-hidden border border-slate-100">
<!-- Waveform bars: Active played section (42%) -->
<div class="w-1 bg-brand-600 rounded-full playing-bar" style="height: 35%; animation-delay: 0.1s;"></div>
<div class="w-1 bg-brand-600 rounded-full playing-bar" style="height: 60%; animation-delay: 0.3s;"></div>
<div class="w-1 bg-brand-600 rounded-full playing-bar" style="height: 90%; animation-delay: 0.15s;"></div>
<div class="w-1 bg-brand-600 rounded-full playing-bar" style="height: 45%; animation-delay: 0.4s;"></div>
<div class="w-1 bg-brand-600 rounded-full playing-bar" style="height: 75%; animation-delay: 0.25s;"></div>
<div class="w-1 bg-brand-600 rounded-full playing-bar" style="height: 100%; animation-delay: 0.05s;"></div>
<div class="w-1 bg-brand-600 rounded-full playing-bar" style="height: 80%; animation-delay: 0.35s;"></div>
<div class="w-1 bg-brand-600 rounded-full playing-bar" style="height: 50%; animation-delay: 0.2s;"></div>
<div class="w-1 bg-brand-600 rounded-full playing-bar" style="height: 65%; animation-delay: 0.45s;"></div>
<div class="w-1 bg-brand-600 rounded-full playing-bar" style="height: 95%; animation-delay: 0.1s;"></div>
<div class="w-1 bg-brand-600 rounded-full playing-bar" style="height: 40%; animation-delay: 0.3s;"></div>
<!-- Waveform bars: Unplayed section (remaining 58%) -->
<div class="w-1 bg-slate-200 rounded-full" style="height: 70%;"></div>
<div class="w-1 bg-slate-200 rounded-full" style="height: 55%;"></div>
<div class="w-1 bg-slate-200 rounded-full" style="height: 85%;"></div>
<div class="w-1 bg-slate-200 rounded-full" style="height: 40%;"></div>
<div class="w-1 bg-slate-200 rounded-full" style="height: 65%;"></div>
<div class="w-1 bg-slate-200 rounded-full" style="height: 90%;"></div>
<div class="w-1 bg-slate-200 rounded-full" style="height: 50%;"></div>
<div class="w-1 bg-slate-200 rounded-full" style="height: 75%;"></div>
<div class="w-1 bg-slate-200 rounded-full" style="height: 35%;"></div>
<div class="w-1 bg-slate-200 rounded-full" style="height: 60%;"></div>
<div class="w-1 bg-slate-200 rounded-full" style="height: 80%;"></div>
<div class="w-1 bg-slate-200 rounded-full" style="height: 45%;"></div>
<div class="w-1 bg-slate-200 rounded-full" style="height: 30%;"></div>
<div class="w-1 bg-slate-200 rounded-full" style="height: 55%;"></div>
</div>
</div>
<!-- Action button: Pause audio -->
<button class="w-full py-2 bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200 text-xs font-bold rounded-xl flex items-center justify-center gap-2 transition active:scale-[0.99]" type="button">
<span class="text-sm">⏸</span>
<span>Tạm dừng audio</span>
</button>
</article>
<!-- END: AudioPlayerCard -->
<!-- BEGIN: QuestionBox -->
<article class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 border-l-4 border-l-brand-600" data-purpose="question-text">
<p class="text-xs font-semibold text-slate-500 mb-1.5 flex items-center gap-1.5">
<span class="w-1.5 h-1.5 rounded-full bg-brand-600"></span>
<span>Câu hỏi trắc nghiệm nghe hiểu</span>
</p>
<p class="text-base font-bold text-slate-900 leading-relaxed font-jp">
          Q. 女の人はこのあと何をしますか。
        </p>
<div class="mt-2 text-[11px] text-slate-500 flex items-center justify-between pt-2 border-t border-dashed border-slate-200">
<span>Dạng bài: Lựa chọn hành động tiếp theo</span>
<span class="px-2 py-0.5 bg-slate-100 rounded text-slate-600 font-semibold">1.5 điểm</span>
</div>
</article>
<!-- END: QuestionBox -->
<!-- BEGIN: AnswerOptionsSection -->
<section class="space-y-2.5 mt-1" data-purpose="answer-choices">
<div class="flex items-center justify-between text-xs text-slate-500 px-1 font-medium">
<span>LỰA CHỌN ĐÁP ÁN</span>
<span class="text-[11px] text-slate-400">Chạm để chọn</span>
</div>
<!-- Option 1: Unselected -->
<button class="w-full bg-white hover:bg-slate-50 border border-slate-200 rounded-2xl p-3.5 flex items-center justify-between text-left transition active:scale-[0.99] shadow-2xs" type="button">
<div class="flex items-center gap-3">
<span class="w-8 h-8 rounded-full bg-slate-100 text-slate-700 font-bold text-xs flex items-center justify-center shrink-0">1</span>
<span class="text-sm font-semibold text-slate-800 font-jp">会社へ行きます。</span>
</div>
<span class="w-5 h-5 rounded-full border border-slate-300 bg-slate-50 shrink-0"></span>
</button>
<!-- Option 2: SELECTED (Active state with Brand Red Border & Checkmark) -->
<button class="w-full bg-red-50/40 border-2 border-brand-600 rounded-2xl p-3.5 flex items-center justify-between text-left shadow-sm transition" type="button">
<div class="flex items-center gap-3">
<span class="w-8 h-8 rounded-full bg-brand-600 text-white font-bold text-xs flex items-center justify-center shrink-0 shadow-xs">2</span>
<span class="text-sm font-bold text-brand-900 font-jp">銀行へ行きます。</span>
</div>
<span class="w-5 h-5 rounded-full bg-brand-600 text-white flex items-center justify-center shrink-0 shadow-2xs">
<svg class="w-3.5 h-3.5" fill="currentColor" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" fill-rule="evenodd"></path>
</svg>
</span>
</button>
<!-- Option 3: Unselected -->
<button class="w-full bg-white hover:bg-slate-50 border border-slate-200 rounded-2xl p-3.5 flex items-center justify-between text-left transition active:scale-[0.99] shadow-2xs" type="button">
<div class="flex items-center gap-3">
<span class="w-8 h-8 rounded-full bg-slate-100 text-slate-700 font-bold text-xs flex items-center justify-center shrink-0">3</span>
<span class="text-sm font-semibold text-slate-800 font-jp">駅で友達を待ちます。</span>
</div>
<span class="w-5 h-5 rounded-full border border-slate-300 bg-slate-50 shrink-0"></span>
</button>
<!-- Option 4: Unselected -->
<button class="w-full bg-white hover:bg-slate-50 border border-slate-200 rounded-2xl p-3.5 flex items-center justify-between text-left transition active:scale-[0.99] shadow-2xs" type="button">
<div class="flex items-center gap-3">
<span class="w-8 h-8 rounded-full bg-slate-100 text-slate-700 font-bold text-xs flex items-center justify-center shrink-0">4</span>
<span class="text-sm font-semibold text-slate-800 font-jp">家に帰ります。</span>
</div>
<span class="w-5 h-5 rounded-full border border-slate-300 bg-slate-50 shrink-0"></span>
</button>
</section>
<!-- END: AnswerOptionsSection -->
</main>
<!-- END: MainQuestionArea -->
<!-- BEGIN: StickyBottomExamNavbar -->
<!-- Sticky Exam Bottom Controls: Prev, List Question, Next -->
<nav class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200/80 py-2.5 px-4 max-w-[430px] mx-auto shadow-lg flex items-center justify-between gap-2">
<!-- Previous Question Button -->
<button class="flex-1 py-2.5 px-3 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 font-bold text-xs rounded-xl flex items-center justify-center gap-1.5 transition" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Câu trước</span>
</button>
<!-- Question List Sheet Trigger Button -->
<button class="flex-[1.2] py-2.5 px-2.5 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-800 font-bold text-xs rounded-xl flex items-center justify-center gap-1.5 transition" type="button">
<svg class="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<rect height="6" rx="1.5" width="6" x="3" y="4"></rect>
<rect height="6" rx="1.5" width="6" x="15" y="4"></rect>
<rect height="6" rx="1.5" width="6" x="3" y="14"></rect>
<rect height="6" rx="1.5" width="6" x="15" y="14"></rect>
</svg>
<span class="truncate">Danh sách câu (7/30)</span>
</button>
<!-- Next Question Button -->
<button class="flex-1 py-2.5 px-3 bg-brand-700 hover:bg-brand-800 active:bg-brand-900 text-white font-bold text-xs rounded-xl flex items-center justify-center gap-1.5 shadow-md shadow-brand-700/20 transition" type="button">
<span>Câu tiếp</span>
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</nav>
<!-- END: StickyBottomExamNavbar -->
</div>
<!-- END: MainContainer -->
</body></html>
