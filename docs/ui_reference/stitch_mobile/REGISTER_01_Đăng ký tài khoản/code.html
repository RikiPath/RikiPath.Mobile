<!DOCTYPE html><html lang="vi"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>1. Đăng ký tài khoản (Mobile Portrait)</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#b7131a',
              redHover: '#9b1016',
              lightRed: '#fef2f2',
              pillBlue: '#eff6ff',
              pillBlueText: '#2563eb'
            }
          }
        }
      }
    }
  </script>
<style data-purpose="custom-layout">
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-white text-slate-900 min-h-screen flex flex-col justify-between antialiased selection:bg-red-100 selection:text-red-700">
<!-- Main Scrollable Content Container -->
<div class="flex-1 flex flex-col justify-between">
<div>
<!-- BEGIN: StatusBar -->
<!-- iOS Mobile Status Bar -->
<div class="w-full pt-3 px-6 pb-2 flex items-center justify-between text-black text-sm font-semibold tracking-tight" data-purpose="status-bar">
<span>9:41</span>
<div class="flex items-center space-x-1.5 text-black">
<!-- Cellular Network Indicator -->
<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
<path d="M2 17h2v4H2v-4zm4-5h2v9H6v-9zm4-4h2v13h-2V8zm4-4h2v17h-2V4zm4-3h2v20h-2V1z"></path>
</svg>
<!-- Wi-Fi Indicator -->
<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.3c3.78 0 7.22 1.48 9.77 3.91L12 19.04 2.23 11.21C4.78 8.78 8.22 7.3 12 7.3z"></path>
</svg>
<!-- Battery Indicator -->
<div class="w-5 h-2.5 border border-black rounded-sm p-0.5 flex items-center">
<div class="w-full h-full bg-black rounded-2xs"></div>
</div>
</div>
</div>
<!-- END: StatusBar -->
<!-- BEGIN: MainHeader -->
<!-- Header Brand Navigation Bar -->
<header class="px-5 pt-3 pb-2 flex items-center justify-between" data-purpose="brand-header">
<div class="flex items-center space-x-2.5">
<!-- Japanese Kanji Brand Emblem -->
<div class="w-9 h-9 rounded-xl bg-[#b7131a] flex items-center justify-center text-white font-bold text-lg shadow-sm">
            文
          </div>
<!-- Brand Logo Text -->
<span class="text-xl font-bold tracking-tight text-[#b7131a]">RikiPath</span>
<!-- Level Pill Badge -->
<span class="bg-[#eff6ff] text-[#2563eb] text-xs font-semibold px-2 py-0.5 rounded-full border border-blue-100">
            N4
          </span>
</div>
<!-- Language Selector Pill -->
<button class="flex items-center space-x-1.5 px-3 py-1 bg-white rounded-full border border-slate-200 text-xs font-medium text-slate-700 hover:bg-slate-50 transition" data-purpose="language-selector" type="button">
<span class="text-sm">🌐</span>
<span class="font-semibold text-slate-800">VI</span>
</button>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: MainContent -->
<main class="px-5 pt-5 pb-6">
<!-- AI Personalization Feature Badge -->
<div class="inline-flex items-center space-x-1.5 bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200/70 px-3.5 py-1.5 rounded-full mb-4 shadow-xs" data-purpose="ai-badge">
<span class="text-amber-500 text-xs">✨</span>
<span class="text-xs font-medium text-amber-900 tracking-tight">Học tiếng Nhật cá nhân hoá cùng AI</span>
</div>
<!-- Heading Group -->
<div class="mb-6">
<h1 class="text-2xl font-bold text-slate-900 tracking-tight">Tạo tài khoản RikiPath</h1>
<p class="mt-1.5 text-sm text-slate-500">Bắt đầu xây dựng lộ trình học JLPT của riêng bạn.</p>
</div>
<!-- Registration Form -->
<form class="space-y-4" data-purpose="registration-form" onsubmit="event.preventDefault();">
<!-- Field 1: Full Name -->
<div>
<label class="block text-sm font-medium text-slate-700 mb-1.5" for="fullName">Họ và tên</label>
<div class="relative rounded-xl border border-slate-200 bg-white focus-within:border-red-600 focus-within:ring-1 focus-within:ring-red-600 transition">
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5">
<svg class="h-4 w-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<input class="w-full bg-transparent border-0 py-3 pl-10 pr-4 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-0" id="fullName" name="fullName" placeholder="Nguyễn Minh Anh" type="text">
</div>
</div>
<!-- Field 2: Email -->
<div>
<label class="block text-sm font-medium text-slate-700 mb-1.5" for="email">Email học viên</label>
<div class="relative rounded-xl border border-slate-200 bg-white focus-within:border-red-600 focus-within:ring-1 focus-within:ring-red-600 transition">
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5">
<svg class="h-4 w-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<input class="w-full bg-transparent border-0 py-3 pl-10 pr-4 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-0" id="email" name="email" placeholder="nhap.email@example.com" type="email">
</div>
</div>
<!-- Field 3: Password -->
<div>
<label class="block text-sm font-medium text-slate-700 mb-1.5" for="password">Mật khẩu</label>
<div class="relative rounded-xl border border-slate-200 bg-white focus-within:border-red-600 focus-within:ring-1 focus-within:ring-red-600 transition">
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5">
<svg class="h-4 w-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<input class="w-full bg-transparent border-0 py-3 pl-10 pr-10 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-0" id="password" name="password" placeholder="••••••••••••" type="password">
<button class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-slate-600" type="button">
<svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
<!-- Password Requirements Hint -->
<p class="mt-1 text-xs text-slate-500 flex items-center space-x-1">
<span>ⓘ</span>
<span>Tối thiểu 8 ký tự, gồm chữ hoa, số hoặc ký tự đặc biệt</span>
</p>
</div>
<!-- Field 4: Confirm Password -->
<div>
<label class="block text-sm font-medium text-slate-700 mb-1.5" for="confirmPassword">Xác nhận mật khẩu</label>
<div class="relative rounded-xl border border-slate-200 bg-white focus-within:border-red-600 focus-within:ring-1 focus-within:ring-red-600 transition">
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5">
<svg class="h-4 w-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<input class="w-full bg-transparent border-0 py-3 pl-10 pr-10 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-0" id="confirmPassword" name="confirmPassword" placeholder="••••••••••••" type="password">
<button class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-slate-600" type="button">
<svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</div>
<!-- Policy & Terms Checkbox -->
<div class="pt-1">
<label class="flex items-start space-x-2.5 cursor-pointer">
<input checked="" class="mt-0.5 h-4 w-4 rounded border-slate-300 text-[#b7131a] focus:ring-[#b7131a]" type="checkbox">
<span class="text-xs text-slate-600 leading-relaxed">
                Bằng việc đăng ký, bạn đồng ý với <a class="font-medium text-slate-900 underline hover:text-[#b7131a]" href="#">Điều khoản dịch vụ</a> &amp; <a class="font-medium text-slate-900 underline hover:text-[#b7131a]" href="#">Chính sách bảo mật</a> của RikiPath.
              </span>
</label>
</div>
<!-- Primary Registration CTA Button -->
<div class="pt-2">
<button class="w-full h-12 bg-[#b7131a] hover:bg-[#9b1016] active:scale-[0.99] text-white font-semibold rounded-xl flex items-center justify-center space-x-2 transition shadow-sm" data-purpose="submit-button" type="submit">
<span>Đăng ký</span>
<span class="text-lg leading-none">→</span>
</button>
</div>
</form>
</main>
<!-- END: MainContent -->
</div>
<!-- BEGIN: MainFooter -->
<footer class="px-5 pb-2 pt-2 text-center" data-purpose="screen-footer">
<!-- Secondary Action Link -->
<div class="mb-4">
<p class="text-sm text-slate-600">
          Đã có tài khoản? 
          <a class="font-semibold text-[#b7131a] hover:underline ml-1" href="#">Đăng nhập</a>
</p>
</div>
<!-- Security Trust Guarantee Badge -->
<div class="flex items-center justify-center space-x-1.5 text-xs text-slate-500 mb-5">
<svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span>Bảo mật chuẩn mã hóa Riki Learning</span>
</div>
<!-- iOS Home Indicator Bar -->
<div class="w-36 h-1 bg-slate-300 rounded-full mx-auto mb-1.5" data-purpose="home-indicator"></div>
</footer>
<!-- END: MainFooter -->
</div>
</body></html>
