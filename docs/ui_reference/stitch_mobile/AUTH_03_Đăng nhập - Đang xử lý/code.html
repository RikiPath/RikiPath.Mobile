<!DOCTYPE html><html lang="vi"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Login Loading State - RikiPath</title>
<!-- Tailwind CSS v3 CDN with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            riki: {
              red: '#b7131a',
              redHover: '#9e1016',
              bgLight: '#fdfbfb',
              badgeBg: '#fef2f2',
              syncBg: '#fefdf6',
              syncBorder: '#fef3c7'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>
<!-- Custom Styles for Specific Visual Nuances -->
<style data-purpose="custom-styling">
    @keyframes indeterminate-progress {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(10%); }
      100% { transform: translateX(200%); }
    }
    .animate-progress-smooth {
      animation: indeterminate-progress 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>
</head>
<body class="bg-white text-slate-800 font-sans antialiased min-h-screen flex justify-center">
<!-- BEGIN: MobileDeviceShell -->
<main class="w-full max-w-[420px] min-h-screen flex flex-col justify-between bg-white px-6 pt-3 pb-4 select-none" data-purpose="mobile-viewport-container">
<!-- BEGIN: TopSection -->
<div class="w-full flex flex-col">
<!-- BEGIN: StatusBar -->
<div class="w-full flex items-center justify-between text-black text-xs font-semibold py-1 mb-3" data-purpose="ios-status-bar">
<span>9:41</span>
<div class="flex items-center space-x-2 text-[14px]">
<!-- Cellular signal -->
<svg class="w-4 h-3 fill-current" fill="none" viewBox="0 0 17 11" xmlns="http://www.w3.org/2000/svg">
<rect height="3" rx="0.5" width="2.5" x="0" y="8"></rect>
<rect height="5.5" rx="0.5" width="2.5" x="4.5" y="5.5"></rect>
<rect height="8" rx="0.5" width="2.5" x="9" y="3"></rect>
<rect height="11" rx="0.5" width="2.5" x="13.5" y="0"></rect>
</svg>
<!-- Wifi -->
<svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
<path d="M12 4C7.3 4 3.08 5.67 0 8.49L12 21.01L24 8.49C20.92 5.67 16.7 4 12 4ZM12 6.5C15.86 6.5 19.38 7.9 22.09 10.23L12 20.77L1.91 10.23C4.62 7.9 8.14 6.5 12 6.5Z"></path>
</svg>
<!-- Battery -->
<div class="w-5 h-2.5 border border-black rounded-sm p-0.5 flex items-center">
<div class="h-full bg-black rounded-2xs w-full"></div>
</div>
</div>
</div>
<!-- END: StatusBar -->
<!-- BEGIN: BrandHeader -->
<header class="flex items-center justify-between mt-1 mb-6" data-purpose="brand-navigation-header">
<div class="flex items-center space-x-2">
<!-- Logo Icon -->
<div class="w-8 h-8 rounded-lg bg-riki-red text-white flex items-center justify-center font-bold text-base shadow-sm">
            文
          </div>
<!-- Logo Text -->
<span class="text-xl font-bold tracking-tight text-riki-red">RikiPath</span>
<!-- Level Badge -->
<span class="text-[11px] font-semibold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full border border-blue-100">N4</span>
</div>
<!-- Language Selector -->
<div class="flex items-center space-x-1 border border-slate-200 rounded-full px-2.5 py-1 bg-slate-50 text-slate-700 text-xs font-medium">
<span class="text-blue-500 text-sm">🌐</span>
<span class="tracking-wide">VI</span>
</div>
</header>
<!-- END: BrandHeader -->
<!-- BEGIN: WelcomeHeader -->
<section class="space-y-2 mb-6" data-purpose="welcome-message-block">
<!-- AI Tag -->
<div class="inline-flex items-center px-3 py-1 rounded-full bg-red-50 text-riki-red text-xs font-medium">
<span>✨ Học tiếng Nhật cá nhân hoá cùng AI</span>
</div>
<!-- Title -->
<h1 class="text-2xl font-black text-slate-900 tracking-tight">
          Chào mừng trở lại! 👋
        </h1>
<!-- Subtitle -->
<p class="text-xs sm:text-sm text-slate-500 leading-relaxed">
          Tiếp tục hành trình chinh phục JLPT cùng RikiPath.
        </p>
</section>
<!-- END: WelcomeHeader -->
<!-- BEGIN: LoginForm -->
<form class="space-y-4" data-purpose="loading-login-form" onsubmit="return false;">
<!-- Email Field (Disabled) -->
<div class="space-y-1">
<label class="block text-xs font-semibold text-slate-700">Email học viên</label>
<div class="relative flex items-center opacity-75">
<span class="absolute left-3.5 text-slate-400 text-sm">✉️</span>
<input aria-label="Email học viên" class="w-full pl-10 pr-10 py-3 text-sm bg-slate-50 border border-slate-200 rounded-xl font-medium text-slate-700 focus:outline-none cursor-not-allowed select-none" disabled="" type="email" value="minhanh.study@rikipath.vn">
<!-- Checkmark -->
<span class="absolute right-3.5 text-emerald-600 font-bold text-sm">✓</span>
</div>
</div>
<!-- Password Field (Disabled) -->
<div class="space-y-1">
<div class="flex items-center justify-between text-xs">
<label class="font-semibold text-slate-700">Mật khẩu</label>
<span class="text-slate-400 font-medium cursor-not-allowed">Quên mật khẩu?</span>
</div>
<div class="relative flex items-center opacity-75">
<span class="absolute left-3.5 text-slate-400 text-sm">🔒</span>
<input aria-label="Mật khẩu" class="w-full pl-10 pr-10 py-3 text-sm bg-slate-50 border border-slate-200 rounded-xl font-mono text-slate-700 focus:outline-none cursor-not-allowed select-none tracking-widest" disabled="" type="text" value="••••••••••••">
<!-- Eye icon representation -->
<span class="absolute right-3.5 text-slate-400 text-sm select-none">👁️</span>
</div>
</div>
<!-- Remember Me Checkbox (Disabled) -->
<div class="flex items-center space-x-2 pt-1 opacity-80">
<input checked="" class="h-4 w-4 rounded border-slate-300 text-riki-red focus:ring-0 cursor-not-allowed accent-riki-red" disabled="" id="remember-me" type="checkbox">
<label class="text-xs text-slate-600 font-medium cursor-not-allowed select-none" for="remember-me">
            Ghi nhớ phiên đăng nhập trên thiết bị này
          </label>
</div>
<!-- Primary CTA Loading Button -->
<div class="pt-2">
<button class="w-full h-12 bg-riki-red text-white font-semibold rounded-xl flex items-center justify-center space-x-2 shadow-md shadow-red-200 cursor-not-allowed active:opacity-100" data-purpose="loading-cta-button" disabled="" type="button">
<!-- Circular Loading Spinner -->
<svg class="animate-spin h-5 w-5 text-white/90" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
<path class="opacity-90" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
<span class="text-sm font-medium tracking-wide">Đang đăng nhập...</span>
</button>
</div>
<!-- BEGIN: SyncStatusBlock -->
<div class="mt-4 p-3 bg-amber-50/60 border border-amber-200/60 rounded-xl flex items-center space-x-2.5" data-purpose="sync-notification-badge">
<span class="text-base flex-shrink-0">⏳</span>
<p class="text-xs text-amber-900 leading-snug">
            Đang đồng bộ dữ liệu lộ trình <strong class="font-bold text-amber-950">N4</strong> của bạn...
          </p>
</div>
<!-- END: SyncStatusBlock -->
<!-- Indeterminate Progress Indicator -->
<div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden mt-3" data-purpose="loading-progress-bar">
<div class="bg-riki-red h-full rounded-full w-2/5 animate-progress-smooth"></div>
</div>
</form>
<!-- END: LoginForm -->
</div>
<!-- END: TopSection -->
<!-- BEGIN: FooterSection -->
<footer class="w-full pt-8 pb-1 flex flex-col items-center justify-center space-y-3" data-purpose="mobile-footer">
<!-- Register Link -->
<div class="text-xs text-slate-500 font-medium">
        Chưa có tài khoản? 
        <span class="text-riki-red font-semibold cursor-not-allowed opacity-80">Đăng ký</span>
</div>
<!-- Security Encryption Badge -->
<div class="flex items-center space-x-1.5 text-[11px] text-slate-400 font-normal">
<svg class="w-3.5 h-3.5 text-slate-400 stroke-current fill-none" stroke-width="2" viewBox="0 0 24 24">
<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
</svg>
<span>Bảo mật chuẩn mã hóa Riki Learning</span>
</div>
<!-- iOS Home Indicator -->
<div class="w-32 h-1 bg-slate-900 rounded-full mt-2" data-purpose="ios-home-indicator"></div>
</footer>
<!-- END: FooterSection -->
</main>
<!-- END: MobileDeviceShell -->
</body></html>
