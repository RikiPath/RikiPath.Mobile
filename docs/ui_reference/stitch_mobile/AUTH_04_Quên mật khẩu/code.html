<!DOCTYPE html><html lang="vi"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Quên mật khẩu - RikiPath</title>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fef2f2',
              100: '#fee2e2',
              200: '#fecaca',
              600: '#dc2626',
              700: '#b7131a',
              800: '#991b1b',
              900: '#7f1d1d',
            },
            slate: {
              850: '#151e2e',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>
<!-- Custom styles for typography and system indicators -->
<style data-purpose="typography">
    body {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
<style data-purpose="status-bar-layout">
    .ios-status-bar {
      height: 44px;
    }
  </style>
</head>
<body class="bg-white text-slate-900 font-sans antialiased min-h-screen flex flex-col justify-between select-none">
<!-- BEGIN: TopContainer -->
<div class="w-full max-w-[430px] mx-auto flex-1 flex flex-col justify-between">
<!-- BEGIN: HeaderSection -->
<header class="w-full">
<!-- iOS Status Bar -->
<div class="ios-status-bar flex justify-between items-center px-7 pt-3 text-xs font-semibold tracking-tight text-slate-900" data-purpose="ios-status-bar">
<span>9:41</span>
<div class="flex items-center space-x-2">
<!-- Cellular signal -->
<svg class="w-4 h-3.5 fill-current" viewBox="0 0 17 12">
<rect height="4" rx="0.5" width="3" x="0" y="8"></rect>
<rect height="6" rx="0.5" width="3" x="4.5" y="6"></rect>
<rect height="9" rx="0.5" width="3" x="9" y="3"></rect>
<rect height="12" rx="0.5" width="3" x="13.5" y="0"></rect>
</svg>
<!-- Wifi icon -->
<svg class="w-4 h-3.5 fill-current" viewBox="0 0 16 12">
<path clip-rule="evenodd" d="M8 2.4c2.5 0 4.8 1 6.5 2.7l1.2-1.2C13.7 1.8 11 0.7 8 0.7s-5.7 1.1-7.7 3.2L1.5 5.1C3.2 3.4 5.5 2.4 8 2.4zm0 4.3c1.4 0 2.7.6 3.6 1.6l1.2-1.2C11.6 5.8 9.9 5 8 5s-3.6.8-4.8 2.1l1.2 1.2c.9-1 2.2-1.6 3.6-1.6zm0 4.3c.9 0 1.6.7 1.6 1.6s-.7 1.6-1.6 1.6-1.6-.7-1.6-1.6.7-1.6 1.6-1.6z" fill-rule="evenodd"></path>
</svg>
<!-- Battery icon -->
<div class="w-6 h-3 border border-slate-900 rounded-sm p-0.5 flex items-center relative">
<div class="h-full w-full bg-slate-900 rounded-2xs"></div>
<div class="w-0.5 h-1.5 bg-slate-900 absolute -right-1 rounded-r-xs"></div>
</div>
</div>
</div>
<!-- Main Navigation Header -->
<nav aria-label="Thanh điều hướng chính" class="h-14 px-5 flex items-center relative border-b border-slate-50">
<!-- Back action button -->
<button aria-label="Quay lại" class="w-10 h-10 flex items-center justify-center text-slate-700 hover:text-slate-900 active:bg-slate-100 rounded-full transition-colors" type="button">
<svg class="w-6 h-6 stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Centered Logo -->
<div class="flex-1 flex justify-center items-center pr-10">
<div class="flex items-center space-x-2">
<span class="w-8 h-8 rounded-lg bg-brand-700 flex items-center justify-center text-white text-base font-bold shadow-sm">文</span>
<span class="text-xl font-bold text-slate-900 tracking-tight">Riki<span class="text-brand-700">Path</span></span>
</div>
</div>
</nav>
</header>
<!-- END: HeaderSection -->
<!-- BEGIN: MainContent -->
<main class="px-6 pt-7 pb-4 flex flex-col items-center flex-1">
<!-- Visual Illustration: Key/Lock Reset Icon -->
<div class="w-20 h-20 rounded-2xl bg-brand-50 border border-brand-100 flex items-center justify-center mb-6 shadow-sm" data-purpose="password-reset-icon-container">
<div class="w-14 h-14 rounded-xl bg-red-100/60 flex items-center justify-center">
<svg class="w-7 h-7 text-brand-700 stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<!-- Circular reload arrow -->
<path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-linecap="round" stroke-linejoin="round"></path>
<!-- Inner Lock element -->
<rect fill="currentColor" fill-opacity="0.2" height="4.5" rx="1" width="5" x="9.5" y="11"></rect>
<path d="M10.5 11V9.5a1.5 1.5 0 013 0V11" stroke-linecap="round"></path>
</svg>
</div>
</div>
<!-- Heading & Introductory Instruction -->
<div class="text-center max-w-xs mb-8">
<h1 class="text-2xl font-bold text-slate-900 tracking-tight mb-2.5">Quên mật khẩu?</h1>
<p class="text-[14.5px] leading-relaxed text-slate-600 font-normal">
          Nhập email đã đăng ký để nhận hướng dẫn đặt lại mật khẩu.
        </p>
</div>
<!-- Forgot Password Request Form -->
<form action="#" class="w-full space-y-4" data-purpose="forgot-password-form" method="POST" onsubmit="event.preventDefault();">
<!-- Email Input Group -->
<div class="space-y-1.5">
<label class="block text-xs font-bold uppercase tracking-wider text-slate-700" for="email">
            Email đã đăng ký
          </label>
<div class="relative">
<!-- Leading Mail Icon -->
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<svg class="w-5 h-5 stroke-[1.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<rect height="16" rx="2" width="20" x="2" y="4"></rect>
<path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Input Field -->
<input class="w-full pl-11 pr-4 py-3.5 bg-white border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-brand-700 focus:border-brand-700 transition duration-150" id="email" name="email" placeholder="nhap.email@example.com" required="" type="email">
</div>
</div>
<!-- Call-to-action Action Buttons -->
<div class="pt-2.5 space-y-3">
<!-- Primary CTA Button -->
<button class="w-full h-12 bg-brand-700 hover:bg-brand-800 active:bg-brand-900 text-white font-medium text-[15px] rounded-xl flex items-center justify-center space-x-2 shadow-sm transition duration-150" data-purpose="submit-button" type="submit">
<span>Gửi yêu cầu</span>
<svg class="w-4 h-4 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Secondary Back to Login CTA Button -->
<a class="w-full h-12 bg-white hover:bg-slate-50 active:bg-slate-100 text-slate-700 border border-slate-200 font-medium text-[15px] rounded-xl flex items-center justify-center space-x-2 transition duration-150" data-purpose="back-login-button" href="#">
<svg class="w-4 h-4 stroke-[2.5] text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Quay lại đăng nhập</span>
</a>
</div>
</form>
</main>
<!-- END: MainContent -->
<!-- BEGIN: FooterSection -->
<footer class="w-full px-6 pb-2 pt-4 flex flex-col items-center space-y-4">
<!-- Sensei Support Link -->
<div class="text-xs text-slate-500 flex items-center justify-center space-x-1 font-normal" data-purpose="support-assist">
<span class="text-sm">💬</span>
<span>Cần trợ giúp trực tiếp?</span>
<a class="text-brand-700 font-semibold hover:underline" href="#">Liên hệ Sensei hỗ trợ</a>
</div>
<!-- iOS Home Indicator -->
<div class="w-full flex justify-center py-2" data-purpose="ios-home-indicator">
<div class="w-36 h-1 bg-slate-300 rounded-full"></div>
</div>
</footer>
<!-- END: FooterSection -->
</div>
<!-- END: TopContainer -->
</body></html>
