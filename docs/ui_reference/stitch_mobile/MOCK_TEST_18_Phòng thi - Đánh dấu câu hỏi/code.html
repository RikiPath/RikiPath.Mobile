<script>
  function selectOption(el) {
    const container = document.getElementById('answer-container');
    const options = container.querySelectorAll('button');
    
    options.forEach(opt => {
      opt.className = "w-full flex items-center justify-between p-space-md rounded-xl bg-surface-container-lowest shadow-sm active:scale-[0.99] transition-all text-left";
      
      const badge = opt.querySelector('div > div:first-child');
      badge.className = "w-8 h-8 rounded-full bg-surface-container text-on-surface-variant font-label-md text-label-md flex items-center justify-center shrink-0 font-bold";
      
      const text = opt.querySelector('div > div:last-child > span:first-child');
      text.className = "font-title-sm text-title-sm text-on-surface";
      const rubyRt = text.querySelector('rt');
      if (rubyRt) rubyRt.className = "font-furigana-mobile text-furigana-mobile text-on-surface-variant";
      
      const checkBadge = opt.querySelector('div:last-child');
      checkBadge.className = "w-6 h-6 rounded-full bg-surface-container-low flex items-center justify-center shrink-0";
      const icon = checkBadge.querySelector('span');
      icon.className = "material-symbols-outlined text-[16px] text-transparent";
    });

    // Apply Active State to Selected
    el.className = "w-full flex items-center justify-between p-space-md rounded-xl bg-surface-container-lowest shadow-sm active:scale-[0.99] transition-all text-left bg-secondary-fixed/30 shadow-[0_0_0_2px_#b7131a]";
    
    const badge = el.querySelector('div > div:first-child');
    badge.className = "w-8 h-8 rounded-full bg-primary text-on-primary font-label-md text-label-md flex items-center justify-center shrink-0 font-bold";
    
    const text = el.querySelector('div > div:last-child > span:first-child');
    text.className = "font-title-sm text-title-sm text-primary font-bold";
    const rubyRt = text.querySelector('rt');
    if (rubyRt) rubyRt.className = "font-furigana-mobile text-furigana-mobile text-primary";
    
    const checkBadge = el.querySelector('div:last-child');
    checkBadge.className = "w-6 h-6 rounded-full bg-primary text-on-primary flex items-center justify-center shrink-0";
    const icon = checkBadge.querySelector('span');
    icon.className = "material-symbols-outlined text-[16px] text-on-primary";
  }

  // Toggle Flag button state for delightful feedback
  const flagBtn = document.getElementById('flag-btn');
  if (flagBtn) {
    flagBtn.addEventListener('click', () => {
      const isFlagged = flagBtn.classList.contains('bg-tertiary-fixed');
      if (isFlagged) {
        flagBtn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-surface-container text-on-surface-variant font-label-md text-label-md shadow-sm active:scale-95 transition-all";
        flagBtn.innerHTML = `
          <span class="material-symbols-outlined text-[18px]">bookmark_border</span>
          <span>Đánh dấu</span>
        `;
      } else {
        flagBtn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-tertiary-fixed text-on-tertiary-fixed font-label-md text-label-md shadow-sm active:scale-95 transition-all";
        flagBtn.innerHTML = `
          <span class="material-symbols-outlined text-[18px] text-tertiary-container" style="font-variation-settings: 'FILL' 1;">bookmark</span>
          <span>Đã đánh dấu</span>
        `;
      }
    });
  }
