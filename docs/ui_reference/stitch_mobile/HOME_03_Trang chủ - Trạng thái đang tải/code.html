  // Ensure the App Shell bottom navigation highlights 'Trang chủ' (Tab 1)
  (function activateHomeTab() {
    const navLinks = document.querySelectorAll('nav a[data-path]');
    navLinks.forEach(link => {
      const path = link.getAttribute('data-path');
      const pill = link.querySelector('div');
      const text = link.querySelector('span');
      if (path === 'trang-chu') {
        link.classList.remove('text-on-surface-variant');
        link.classList.add('text-primary');
        if (text) {
          text.classList.add('font-bold');
        }
        if (pill) {
          pill.classList.add('bg-primary-fixed');
          const icon = pill.querySelector('span');
          if (icon) {
            icon.style.fontVariationSettings = "'FILL' 1";
          }
        }
      } else {
        link.classList.remove('text-primary');
        link.classList.add('text-on-surface-variant');
        if (text) {
          text.classList.remove('font-bold');
        }
        if (pill) {
          pill.classList.remove('bg-primary-fixed');
          const icon = pill.querySelector('span');
          if (icon) {
            icon.style.fontVariationSettings = "'FILL' 0";
          }
        }
      }
    });
  })();
